# Use-Case examples for /agents/canvas/
# Five branches, each a tight realistic AGENTS canvas.

- id: solar-rfi
  icon: ☀
  branch: 'Energie / Versorger'
  label: 'Solar-RFI-Triage'
  summary: 'Designrelevante RFIs aus Procore filtern und priorisieren.'
  title: 'Solar-RFI-Triage (Novel Energy)'
  a: |-
    Eingehende RFIs/Submittals aus Procore scannen, designrelevante Änderungen flaggen, eine 1-Satz-Zusammenfassung + 3 Optionen an die PL liefern.

    Scope: Solar-Projekte (kein Wind, kein BESS).
    Erfolg: ≥ 90 % korrekt geflaggt, ≤ 5 % False-Positives.
  g: |-
    GPT-4o-mini für Erst-Triage (günstig, latenzarm).
    Claude Sonnet nur bei Eskalation.
    Keine Personendaten — Datenschutz unkritisch.
  e: |-
    Procore-API (read-only RFIs + Submittals).
    Interne Doc-DB (As-built-Vergleich).
    MS Teams (Notification).

    Least Privilege: keine Submit-Rechte zurück nach Procore.
  n: |-
    RAG: As-built-Pläne aller Projekte, Trafo-Specs pro Site.
    Vector-Index: historische Submittal-Patterns (24 Monate).
    Files on-demand statt Kontext-Dump.
  t: |-
    Single-Agent Loop: Doc → Klassifikation → Bei "ja" Detail-Analyse → Summary + 3 Optionen → Teams-Notify.

    Kein Multi-Agent — unnötige Komplexität für diesen Scope.
  s: |-
    Human-in-the-Loop bei jeder Empfehlung.
    Datadog-Tracing pro Doc.
    Wöchentliche Evals gegen 50 Regression-Docs.

    EU AI Act: Low-Risk, keine besonderen Pflichten.

- id: schaden-class
  icon: 🛡
  branch: 'Versicherung / Banken'
  label: 'Schaden-Klassifikation'
  summary: 'Schadenmeldungen automatisch sortieren und zuweisen.'
  title: 'Schadenmeldung-Erstklassifikation'
  a: |-
    Eingehende Schadensmeldungen nach Sparte, Komplexität, Eilbedürftigkeit klassifizieren. Tag, Eskalations-Stufe (1–3) und Sachbearbeiter-Vorschlag liefern.

    Scope: Sach-/Hausrat. KEIN KFZ, KEINE Personenschäden in v1.
  g: |-
    Llama 3.3 70B auf eigener EU-Infra (Hetzner Frankfurt).
    Datenschutz kritisch: keine API-Provider im Customer-Pfad.
    Frontier nur für Evals mit synthetischen Daten.
  e: |-
    Mail-Gateway (read).
    Schadens-System-API (write nur Tags + Vorgangs-Nr.).
    Sparte-Definition-DB.
  n: |-
    Vector-Index: 5 Jahre Schadensdaten.
    RAG: Sparte-Definitionen aus Compliance-Handbuch.
    Memory pro Vorgang: Kundenhistorie verknüpft.
  t: |-
    Plan → Klassifizieren → Confidence-Check → Verify.

    Confidence < 80 % → Handoff an Sachbearbeiter:in mit Begründung.
    Confidence ≥ 80 % → direkte Zuweisung.
  s: |-
    LangSmith Audit-Trail (Ein-/Ausgangsdaten).
    Vier-Augen-Prinzip bei Stufe 3.
    PLZ-Bias-Monitoring.

    EU AI Act: Annex III relevant — Hochrisiko-Pfad ab 12/2027 vorbereiten.

- id: pflege-doku
  icon: ❤
  branch: 'Gesundheit / Pflege'
  label: 'Pflege-Doku-Assistent'
  summary: 'Aus Sprachnotiz nach Visite einen Doku-Entwurf erstellen.'
  title: 'Pflege-Doku-Assistent'
  a: |-
    Aus 2-Min-Sprachnotiz nach Pflegevisite strukturierten Doku-Entwurf (Vitalwerte, Beobachtungen, Maßnahmen) zur Freigabe durch die Pflegekraft erstellen.

    Scope: stationäre Pflege. KEINE Akutmedizin, KEINE Medikamentenempfehlungen.
  g: |-
    Whisper lokal für Transkription (Stimme verlässt Einrichtung nicht).
    Mistral Large via EU-API für Strukturierung.
    AVV mit Mistral vorhanden, PHI bleibt EU-resident.
  e: |-
    Spracherkennungs-Tablet (Stationszimmer).
    Pflege-IS API (z. B. vivendi/CGM), write NUR in "Entwurf".
    Standardvisite-Templates.

    Berechtigung: write NIE Final-Status.
  n: |-
    Patient:innen-Stammdaten on-demand (Diagnose, Allergien, Therapien).
    RAG: Pflegestandards der Einrichtung.
    Fachglossar gegen Halluzination bei Fachtermini.
  t: |-
    Voice → Transkript → Strukturierung → Template-Befüllung → Pflegekraft-Review → Freigabe.

    Single-Agent. Multi-Agent verboten — Komplexität ist Risiko in medizinischem Kontext.
  s: |-
    HARTE Regel: kein Final-Status ohne menschliche Freigabe.
    Monitoring False-Negative (übersehene Symptome) — wichtigste Metrik.
    Eval-Runs gegen anonymisierte Vergleichsdokus.

    EU AI Act: Annex III Hochrisiko + GPAI-Pflichten (08/2025 aktiv). CE-Kennzeichnung Medizinprodukt prüfen.

- id: service-routing
  icon: ⚙
  branch: 'Maschinenbau / Industrie'
  label: 'Service-Ticket-Routing'
  summary: 'Service-Tickets automatisch dem richtigen Techniker zuweisen.'
  title: 'Service-Ticket-Smart-Routing'
  a: |-
    Service-Tickets (Email, Hotline, Portal) an passenden Techniker-Pool routen — basierend auf Maschinen-Modell, Symptom, Standort. Plus 3 wahrscheinlichste Ursachen aus Historie.

    Erfolg: ≥ 85 % Korrekt-Routing, < 10 Min Bearbeitungszeit.
  g: |-
    Qwen 2.5 32B auf eigenem Hetzner-Cluster.
    Günstig, kontextstark (128k), EU-resident.
    Frontier nur bei Confidence < 60 %.
  e: |-
    Service-CRM (SAP S/4) read+write.
    Knowledge-Base (Confluence) read.
    Telefonie-API für Hotline-Transkripte (read).

    Least Privilege: keine Kundendaten-Edits, nur Ticket-Felder.
  n: |-
    Vector-Index: 10 Jahre Service-Historie (~3M Tickets).
    Strukturierte DB: Modellbaureihen + Fehler-Patterns.
    Techniker-Profile: Skills, Standort, Verfügbarkeit.
  t: |-
    Loop: Ticket → Klassifikation → Pool-Match → Ähnlichkeitssuche → 3 Hypothesen → Notify.

    Multi-Agent nur bei strittiger Klassifikation: zwei LLM-Calls, Disagreement → Human.
  s: |-
    Audit-Log pro Routing-Entscheidung.
    Eskalation an Disponent:in bei Confidence < 70 %.
    Drift-Detection für neue Maschinen-Modelle.

    EU AI Act: Low-Risk.

- id: buerger-mail
  icon: 🏛
  branch: 'Öffentlicher Sektor'
  label: 'Bürger-Mail-Klassifikator'
  summary: 'Bürger-Mails sortieren, Antwortvorschläge zur Freigabe vorbereiten.'
  title: 'Bürger-Mail-Klassifikator'
  a: |-
    Bürger-Mails nach Fachbereich, Dringlichkeit, Anliegen-Typ klassifizieren. Pro Mail einen 2-Satz-Antwortvorschlag zur Freigabe durch Sachbearbeiter:in liefern.

    Scope: Kommune 50–200k Einwohner, alle Fachbereiche.
    HARTE Regel: KEIN Versand ohne menschliche Freigabe.
  g: |-
    Claude Sonnet via Anthropic EU-Region für Erstklassifikation.
    Llama 3.3 lokal (StackIT) für Antwort-Generierung.
    AVV mit Anthropic + Datenschutz-Folgenabschätzung dokumentiert.
  e: |-
    Mail-Server-API (IMAP read; SMTP nur durch Mensch).
    Fachverfahren-System (z. B. enaio) write nur "Entwurf".
    Wissens-DB häufiger Bürger-Anliegen.
  n: |-
    RAG: Verfahrensanweisungen pro Fachbereich (täglicher Refresh).
    Frage-Antwort-Wissensdatenbank (kuratiert).
    Eskalations-Matrix bei sensiblen Themen (Sozialhilfe, Asyl, Beschwerden).
  t: |-
    Plan → parse → klassifizieren → ähnliche Fälle → Antwort-Entwurf → Sachbearbeiter-Review.

    Single-Agent. Kein Handoff — Verantwortung soll klar bleiben.
  s: |-
    Striktes Human-in-the-Loop.
    Bias-Check vor jeder Antwort-Generierung (diskriminierende Sprache).
    Bias-Audit halbjährlich extern.

    EU AI Act: potenziell Hochrisiko bei Sozialleistungen. Transparenz-Pflicht 08/2026 aktiv.
