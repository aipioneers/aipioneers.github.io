# Use-case examples for /agents/canvas/ — EN translation
# Five industries, each a tight realistic AGENTS canvas.

- id: solar-rfi
  icon: sun
  branch: 'Energy / Utilities'
  label: 'Solar-RFI Triage'
  summary: 'Filter and prioritise design-relevant RFIs from Procore.'
  title: 'Solar-RFI Triage (Novel Energy)'
  a: |-
    Scan incoming RFIs/submittals from Procore, flag design-relevant changes, deliver a 1-sentence summary + 3 options to the project lead.

    Scope: solar projects (no wind, no BESS).
    Success: ≥ 90 % correctly flagged, ≤ 5 % false positives.
  g: |-
    GPT-4o-mini for first-line triage (cheap, low latency).
    Claude Sonnet only on escalation.
    No personal data — privacy uncritical.
  e: |-
    Procore API (read-only RFIs + submittals).
    Internal doc DB (as-built comparison).
    MS Teams (notification).

    Least privilege: no submit rights back into Procore.
  n: |-
    RAG: as-built drawings of all projects, transformer specs per site.
    Vector index: historical submittal patterns (24 months).
    Files on-demand instead of context dump.
  t: |-
    Single-agent loop: Doc → classification → on "yes" detail analysis → summary + 3 options → Teams notify.

    No multi-agent — unnecessary complexity for this scope.
  s: |-
    Human-in-the-loop on every recommendation.
    Datadog tracing per doc.
    Weekly evals against 50 regression docs.

    EU AI Act: low-risk, no special obligations.

- id: schaden-class
  icon: shield
  branch: 'Insurance / Banking'
  label: 'Claim classification'
  summary: 'Automatically sort and assign incoming insurance claims.'
  title: 'Claim first-line classification'
  a: |-
    Classify incoming claims by line of business, complexity, urgency. Deliver a tag, escalation level (1–3) and a case-worker suggestion.

    Scope: property/contents. NO motor, NO personal injury in v1.
  g: |-
    Llama 3.3 70B on own EU infrastructure (Hetzner Frankfurt).
    Privacy critical: no API providers in customer path.
    Frontier only for evals with synthetic data.
  e: |-
    Mail gateway (read).
    Claims-system API (write only tags + case number).
    Line-of-business definition DB.
  n: |-
    Vector index: 5 years of claims data.
    RAG: line-of-business definitions from compliance handbook.
    Memory per case: customer history linked.
  t: |-
    Plan → classify → confidence check → verify.

    Confidence < 80 % → handoff to case worker with reasoning.
    Confidence ≥ 80 % → direct assignment.
  s: |-
    LangSmith audit trail (input/output data).
    Four-eyes principle at level 3.
    ZIP-code bias monitoring.

    EU AI Act: Annex III relevant — prepare high-risk path from 12/2027.

- id: pflege-doku
  icon: heart
  branch: 'Healthcare / Care'
  label: 'Care documentation assistant'
  summary: 'Turn a voice note after a visit into a documentation draft.'
  title: 'Care documentation assistant'
  a: |-
    From a 2-minute voice note after the care visit, produce a structured documentation draft (vitals, observations, measures) for the nurse to approve.

    Scope: inpatient care. NO emergency medicine, NO medication recommendations.
  g: |-
    Whisper on-device for transcription (voice never leaves the facility).
    Mistral Large via EU API for structuring.
    DPA with Mistral in place, PHI stays EU-resident.
  e: |-
    Speech-recognition tablet (ward room).
    Care-IS API (e.g. vivendi/CGM), write ONLY into "draft" status.
    Standard-visit templates.

    Permission: never write final status.
  n: |-
    Patient master data on-demand (diagnosis, allergies, therapies).
    RAG: facility care standards.
    Domain glossary against hallucination on specialist terms.
  t: |-
    Voice → transcript → structuring → template fill → nurse review → approval.

    Single-agent. Multi-agent forbidden — complexity is risk in a medical context.
  s: |-
    HARD rule: no final status without human approval.
    Monitor false negatives (missed symptoms) — the key metric.
    Eval runs against anonymised reference documentation.

    EU AI Act: Annex III high-risk + GPAI obligations (active from 08/2025). Check CE marking as a medical device.

- id: service-routing
  icon: gear
  branch: 'Mechanical engineering / Industry'
  label: 'Service-ticket routing'
  summary: 'Route service tickets to the right technician automatically.'
  title: 'Service-ticket smart routing'
  a: |-
    Route service tickets (email, hotline, portal) to the right technician pool — based on machine model, symptom, location. Plus 3 most-likely causes from history.

    Success: ≥ 85 % correct routing, < 10 min handling time.
  g: |-
    Qwen 2.5 32B on own Hetzner cluster.
    Cheap, strong context (128k), EU-resident.
    Frontier only when confidence < 60 %.
  e: |-
    Service CRM (SAP S/4) read+write.
    Knowledge base (Confluence) read.
    Telephony API for hotline transcripts (read).

    Least privilege: no customer-data edits, ticket fields only.
  n: |-
    Vector index: 10 years of service history (~3M tickets).
    Structured DB: machine model lines + fault patterns.
    Technician profiles: skills, location, availability.
  t: |-
    Loop: ticket → classification → pool match → similarity search → 3 hypotheses → notify.

    Multi-agent only on disputed classification: two LLM calls, disagreement → human.
  s: |-
    Audit log per routing decision.
    Escalation to dispatcher when confidence < 70 %.
    Drift detection for new machine models.

    EU AI Act: low-risk.

- id: buerger-mail
  icon: building
  branch: 'Public sector'
  label: 'Citizen-mail classifier'
  summary: 'Sort citizen mail, prepare reply drafts for approval.'
  title: 'Citizen-mail classifier'
  a: |-
    Classify citizen mail by department, urgency, request type. For each mail deliver a 2-sentence reply draft for the case worker to approve.

    Scope: municipality of 50–200k inhabitants, all departments.
    HARD rule: NO send-out without human approval.
  g: |-
    Claude Sonnet via Anthropic EU region for first-line classification.
    Llama 3.3 local (StackIT) for reply generation.
    DPA with Anthropic + data-protection impact assessment documented.
  e: |-
    Mail server API (IMAP read; SMTP by human only).
    Departmental system (e.g. enaio) write to "draft" only.
    Knowledge DB of frequent citizen requests.
  n: |-
    RAG: procedural guidelines per department (daily refresh).
    Curated Q&A knowledge base.
    Escalation matrix for sensitive topics (welfare, asylum, complaints).
  t: |-
    Plan → parse → classify → similar cases → reply draft → case-worker review.

    Single-agent. No handoff — responsibility must stay clear.
  s: |-
    Strict human-in-the-loop.
    Bias check before every reply generation (discriminatory language).
    Bias audit semi-annually by external auditor.

    EU AI Act: potentially high-risk for welfare-related replies. Transparency obligation active from 08/2026.
