home_beta_title: "Noch nicht im offenen Verkauf."
home_beta_p1: "Die Open-Source-CLIs sind frei und sofort nutzbar. Die Vertical-AI-Plattform und die Cloud-Begleitung sind aktuell in Closed Beta mit einem kleinen Kreis Mittelstands-Pioniere, die mit uns das Modell verfeinern. Keine Preislisten, keine Sales-Calls, keine Roadmap-Versprechen. Wir öffnen, sobald es trägt."
home_beta_p2: "Mitlesen: auf GitHub. Mitbauen: die Tür ist nicht verschlossen — aber wir hören, wenn jemand klopft."
