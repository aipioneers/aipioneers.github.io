home_founder_eyebrow: "Founder"
home_founder_name: "Tobias Oberrauch"
home_founder_p1: "25+ Jahre IT. Zuletzt CEO der KI-Sparte eines börsennotierten Mittelstands-Konzerns. Solo Founder von AI Pioneers — eine Person, sechs KI-Companies, fünf Verticals, ein klarer Fokus auf den DACH-Mittelstand."
home_founder_p2: "Kundenkontakt, Verhandlung, Vertrag, Eskalation, Beziehungspflege: persönlich, immer. Alles andere: Paperclip-AI-Teams mit drei Quality Gates pro Lieferung."
home_founder_link: "Mehr zur Person →"

home_oss_title: "Open Source — woher wir kommen"
home_oss_subtitle: "Drei Werkzeuge, mit denen AI Pioneers selbst arbeitet. Frei nutzbar, von der Community getragen, von uns gepflegt."
home_oss_install_eyebrow: "Installation per pip"

home_beta_badge: "Closed Beta"
home_beta_title: "Noch nicht im offenen Verkauf."
home_beta_p1: "Die Open-Source-CLIs sind frei und sofort nutzbar. Die Vertical-AI-Plattform und die Cloud-Begleitung sind aktuell in Closed Beta mit einem kleinen Kreis Mittelstands-Pioniere, die mit uns das Modell verfeinern. Keine Preislisten, keine Sales-Calls, keine Roadmap-Versprechen. Wir öffnen, sobald es trägt."
home_beta_p2: "Mitlesen: auf GitHub. Mitbauen: die Tür ist nicht verschlossen — aber wir hören, wenn jemand klopft."
