home_spotlight_insight_body: "Ἔξωθεν ἔρευνα ἀγορᾶς, ἔσωθεν ὄψις δεδομένων, στρατηγικὴ κρίσις. Ἐναργεῖς ὁδοὶ + χάρτης κδ´ μηνῶν προτεταγμένος."
