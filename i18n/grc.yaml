home_founder_eyebrow: "Κτίστης"
home_founder_name: "Τοβίας Ὀβερράουχ"
home_founder_p1: "Πεντεκαίδεκα καὶ πλέον ἔτη ἐν IT. Νεωστὶ CEO τῆς τοῦ τεχνητοῦ νοῦ τμήσεως δημοσίας ἑταιρείας μέσης κλάσεως. Μόνος κτίστης τῆς AI Pioneers — εἷς ἄνθρωπος, ἓξ τεχνηταὶ ἑταιρεῖαι, πέντε τέχναι, εἷς σαφὴς σκοπὸς ἐπὶ τοῖς γερμανοφώνοις ἐμπόροις."
home_founder_p2: "Πρὸς πελάτας ὁμιλία, διαπραγμάτευσις, συμβόλαιον, ἐπιδίωξις, φυλακὴ τῶν σχέσεων: αὐτοπροσώπως, ἀεί. Τὰ ἄλλα: αἱ Paperclip-τεχνηταὶ ὁμάδες μετὰ τριῶν πυλῶν ποιότητος ἐν ἑκάστῃ παραδόσει."
home_founder_link: "Πλείω περὶ τοῦ κτίστου →"

home_oss_title: "Ἀνεῳγμένη πηγή — ὅθεν ἐρχόμεθα"
home_oss_subtitle: "Τρία ὄργανα οἷς αὐτοὶ οἱ AI Pioneers χρώμεθα. Ἐλεύθερα, ὑπὸ κοινότητος βαστάζομενα, ὑφ᾽ ἡμῶν θεραπευόμενα."
home_oss_install_eyebrow: "Ἐγκατάστασις διὰ pip"

home_beta_badge: "Κεκλεισμένη Beta"
home_beta_title: "Οὔπω εἰς ἀνοικτὴν πώλησιν."
home_beta_p1: "Αἱ ἐλεύθεραι CLI ἤδη χρήσιμαί εἰσιν. Ἡ πλατφόρμα καὶ ὁ νεφέλιος σύνοδος νῦν ἐν κεκλεισμένῃ beta μετὰ ὀλίγου κύκλου μέσων ἐμπόρων πρωτοπόρων. Οὔ τιμῶν, οὔ κλήσεων πωλήσεως, οὔ ὑποσχέσεων ὁδοῦ. Ἀνοίγομεν ὅταν φέρῃ."
home_beta_p2: "Ἕπεσθαι: ἐν τῷ GitHub. Συνοικοδομεῖν: ἡ θύρα οὐ κέκλεισται — ἀλλὰ ἀκούομεν ὅταν τις κρούῃ."
