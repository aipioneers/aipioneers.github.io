home_manifest_eyebrow: "Μανιφέστον"
home_manifest_lede: "Οὐ πιστεύομεν τῷ τοῦ τεχνητοῦ νοῦ θορύβῳ. Πιστεύομεν τῷ ἔργῳ τῶν πρωτοπόρων τοῖς μέσοις ἐμπόροις τῆς γερμανικῆς γλώσσης. AI Pioneers πλατφόρμα ἐστὶ τεχνητοῦ νοῦ κατὰ τέχνας μερισμένου, ὑφ᾽ ἑνὸς ἀνθρώπου ἀγομένη, ὑπὸ τεχνητῶν ὁμάδων διοικουμένη — πρὸς πέντε ἀκριβεῖς πόνους πραγματικούς."
